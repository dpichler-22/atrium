name: Bug report
description: Something in Atrium doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab
        2. Type /...
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 155 on macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atrium version
      description: Shown in chrome://extensions
      placeholder: 1.3.0
